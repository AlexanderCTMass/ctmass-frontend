name: Deploy to Firebase Production

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: "--max_old_space_size=4096"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --force

      - name: Build with production env
        run: npm run build
        env:
          CI: false

      - name: Write Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          SA_FILE="${{ runner.temp }}/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA_FILE"
          echo "Credential bytes: $(wc -c < "$SA_FILE")"
          SA_FILE="$SA_FILE" node -e 'const j=require(process.env.SA_FILE); console.log("project_id:", j.project_id, "| client_email:", j.client_email);' \
            || { echo "ERROR: FIREBASE_SERVICE_ACCOUNT secret is empty or not valid JSON"; exit 1; }

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15.21.0

      - name: Deploy to Firebase Production
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
          FIREBASE_CLI_EXPERIMENTS: webframeworks
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Deploy attempt $attempt..."
            if firebase deploy --only hosting --project ctmass-8f048 --non-interactive; then
              echo "Deploy succeeded on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 20s..."
            sleep 20
          done
          echo "All deploy attempts failed"
          exit 1