<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>CTMASS</title>
    <link rel="icon" href="/favicon.ico">
    <script>
        (function () {
            var APP_STORE_URL = 'https://apps.apple.com/us/app/ctmass-homeowners-pros/id6806073536';
            var GOOGLE_PLAY_URL = 'https://play.google.com/store/apps/details?id=com.ctmass.app&hl=en';
            var ua = navigator.userAgent || '';
            var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            var isAndroid = /android/i.test(ua);
            var target = isIOS ? APP_STORE_URL : isAndroid ? GOOGLE_PLAY_URL : '/';
            window.location.replace(target);
        })();
    </script>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #111927;
            text-align: center;
            padding: 16px;
            box-sizing: border-box;
        }
        img { width: 96px; height: 96px; }
        a { color: #2E7D32; font-weight: 600; text-decoration: none; }
        .links { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    </style>
</head>
<body>
<img src="/assets/logo.png" alt="CTMASS">
<p>Redirecting…</p>

    <a href="https://play.google.com/store/apps/details?id=com.ctmass.app&hl=en">Google Play</a>
    <a href="/">ctmass.com</a>
</div>
</body>
</html>
